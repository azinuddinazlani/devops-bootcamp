<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Card — DevOps Bootcamp 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1117;
    font-family: system-ui, -apple-system, sans-serif;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.08); opacity: .85; }
  }

  .card {
    animation: fadeIn .8s ease-out both;
    background: #1a1d27;
    border-radius: 20px;
    padding: 48px 40px;
    text-align: center;
    max-width: 360px;
    width: 90%;
    box-shadow: 0 8px 32px rgba(0,0,0,.35);
    transition: transform .3s ease, box-shadow .3s ease;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 14px 40px rgba(100,130,255,.2);
  }

  .badge {
    display: inline-block;
    padding: 6px 18px;
    border-radius: 999px;
    background: linear-gradient(135deg, #6366f1, #a78bfa, #818cf8);
    color: #fff;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .5px;
    text-transform: uppercase;
    margin-bottom: 24px;
    animation: pulse 2.5s ease-in-out infinite;
  }

  .name {
    font-size: 1.75rem;
    font-weight: 700;
    color: #f1f3f9;
    margin-bottom: 8px;
  }

  .role {
    font-size: .95rem;
    color: #8b90a0;
    margin-bottom: 28px;
  }

  .detail {
    font-size: .85rem;
    color: #565b6e;
    line-height: 1.8;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">Cohort 1 — 2026</div>
    <h1 class="name">Azin</h1>
    <p class="role">DevOps Engineer</p>
    <p class="detail">
      DevOps Bootcamp<br>
      Cohort 1 &middot; 2026
    </p>
  </div>
</body>
</html>
